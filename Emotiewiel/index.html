<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
:root{
  --cream:#F9F5F0;
  --warm:#F0E8DC;
  --white:#FEFEFE;
  --gold:#B8965A;
  --gold2:#9A7A3A;
  --ink:#1C1410;
  --soft:#6A5A4A;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',sans-serif;
}
body{
  font-family:var(--sans);font-size:17px;line-height:1.85;
  color:var(--ink);background:var(--cream);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:54px;
  background:rgba(249,245,240,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(184,150,90,.15);
}
.nav-brand{font-family:var(--serif);font-size:19px;letter-spacing:.28em;color:var(--ink);text-decoration:none;font-weight:600;display:flex;align-items:center;gap:10px;}
.nav-brand img{height:30px;width:auto;}
.nav-right{display:flex;align-items:center;gap:8px;}
.lang-btn{
  background:none;border:none;cursor:pointer;
  font-family:var(--sans);font-size:11px;letter-spacing:.18em;
  color:var(--soft);padding:6px 8px;text-transform:uppercase;transition:color .2s;
}
.lang-btn.active{color:var(--gold2);border-bottom:1px solid var(--gold);}
.lang-btn:hover{color:var(--gold);}
.gr{height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);}
.inner{max-width:680px;margin:0 auto;padding:0 24px;}
.pad{padding:72px 0;}
.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2);margin-bottom:14px;}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,6vw,52px);line-height:1.15;margin-bottom:18px;}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4.5vw,34px);line-height:1.25;margin-bottom:14px;}
p.lede{font-size:18px;color:var(--soft);}
.hero{padding:110px 0 40px;text-align:center;}
.hero img.hero-logo{height:64px;width:auto;margin-bottom:20px;opacity:.9;}

.wheel-wrap{display:flex;justify-content:center;padding:8px 0 0;}
#wheel{width:min(94vw,600px);height:auto;display:block;touch-action:manipulation;}
#wheel path{cursor:pointer;transition:opacity .25s,filter .25s;}
#wheel text{pointer-events:none;user-select:none;}
.seg-dim{opacity:.22;}
.seg-active{filter:brightness(1.06);}
.core-label{font-family:var(--sans);font-weight:500;letter-spacing:.08em;fill:#FEFEFE;text-transform:uppercase;}
.word-label{font-family:var(--sans);font-weight:400;fill:#FEFEFE;letter-spacing:.04em;}
.outer-label{font-family:var(--sans);font-weight:400;fill:#3A2A1A;letter-spacing:.03em;}
.hint{font-size:13px;color:var(--soft);text-align:center;margin-top:10px;letter-spacing:.04em;padding:0 24px;}

.refine{max-width:560px;margin:22px auto 0;text-align:center;display:none;}
.refine.show{display:block;animation:fadeUp .4s ease both;}
.refine-title{font-family:var(--serif);font-size:22px;margin-bottom:6px;}
.refine-sub{font-size:13px;color:var(--soft);margin-bottom:14px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.chip{
  border:1px solid rgba(184,150,90,.45);background:var(--white);
  padding:9px 18px;border-radius:999px;font-family:var(--sans);
  font-size:14px;letter-spacing:.05em;color:var(--ink);cursor:pointer;
  transition:all .2s;
}
.chip:hover{border-color:var(--gold);}
.chip.sel{background:var(--ink);color:var(--cream);border-color:var(--ink);}

.flow{display:none;margin-top:46px;}
.flow.show{display:block;animation:fadeUp .5s ease both;}
.step-card{
  background:var(--white);border:1px solid rgba(184,150,90,.25);
  border-radius:14px;padding:30px 26px;margin-bottom:20px;
}
.step-eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2);margin-bottom:8px;}
.step-card h3{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:10px;}
.step-card p{font-size:15px;color:var(--soft);margin-bottom:14px;}
.step-card p.why{font-size:14px;color:var(--soft);font-style:italic;border-left:2px solid var(--gold);padding-left:14px;margin:14px 0;}
.examples{font-size:13.5px;color:var(--soft);background:var(--warm);border-radius:10px;padding:12px 16px;margin:10px 0 14px;line-height:1.75;}
.examples span{color:var(--gold2);font-size:10px;letter-spacing:.22em;text-transform:uppercase;display:block;margin-bottom:4px;}
.when{max-width:640px;margin:0 auto;padding:26px 24px 8px;text-align:center;}
.when p{font-size:15px;color:var(--soft);}
textarea{
  width:100%;min-height:90px;border:1px solid rgba(184,150,90,.35);
  border-radius:10px;padding:12px 14px;font-family:var(--sans);
  font-size:15px;line-height:1.7;color:var(--ink);background:var(--cream);
  resize:vertical;
}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
.slider-row{display:flex;align-items:center;gap:14px;margin-top:6px;}
input[type=range]{flex:1;accent-color:var(--gold);}
.slider-val{font-family:var(--serif);font-size:26px;width:38px;text-align:center;color:var(--gold2);}
.body-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.body-chips .chip{font-size:13px;padding:7px 14px;}
.breath{text-align:center;margin:4px 0 20px;padding:18px 14px;background:var(--cream);border:1px solid rgba(184,150,90,.25);border-radius:12px;}
.breath-title{font-family:var(--serif);font-size:19px;margin-bottom:12px;}
.breath-circle{width:78px;height:78px;border-radius:50%;margin:0 auto 12px;background:radial-gradient(circle at 35% 30%,#C8A870,var(--gold2));transform:scale(.68);transition:transform 4s ease-in-out;opacity:.9;}
.breath-circle.grow{transform:scale(1.12);}
.breath-circle.slow{transition-duration:6s;}
.breath-label{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);min-height:20px;}
.breath-btn{margin-top:12px;}
.support{margin-top:20px;font-size:13.5px;line-height:1.8;color:rgba(249,245,240,.8);border-top:1px solid rgba(201,169,110,.35);padding-top:16px;display:none;text-align:left;max-width:440px;margin-left:auto;margin-right:auto;}
.support.show{display:block;}

.btn{
  display:inline-block;background:var(--ink);color:var(--cream);
  font-family:var(--sans);font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;padding:15px 34px;border:none;
  border-radius:999px;cursor:pointer;transition:opacity .2s;
}
.btn:hover{opacity:.85;}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(28,20,16,.3);}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}

.summary{display:none;margin-top:40px;}
.summary.show{display:block;animation:fadeUp .5s ease both;}
.summary-card{
  background:var(--ink);color:var(--cream);border-radius:16px;
  padding:38px 30px;text-align:center;
}
.summary-card .eyebrow{color:var(--gold);}
.summary-word{font-family:var(--serif);font-size:clamp(30px,6vw,42px);font-style:italic;margin:6px 0 4px;}
.summary-family{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(249,245,240,.6);margin-bottom:18px;}
.summary-lines{font-size:15px;line-height:1.9;color:rgba(249,245,240,.85);text-align:left;max-width:440px;margin:0 auto 22px;}
.summary-lines b{color:var(--gold);font-weight:500;}
.copied{font-size:12px;color:var(--gold);margin-top:10px;display:none;}

.method-note{background:var(--warm);}
.method-note .inner{max-width:640px;}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px;}
.three div{text-align:center;}
.three .n{font-family:var(--serif);font-size:30px;color:var(--gold2);}
.three .t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-top:2px;}
.three .d{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.6;}
@media(max-width:560px){.three{grid-template-columns:1fr;gap:22px;}}

.cta{text-align:center;}
.cta p{max-width:520px;margin:0 auto 24px;color:var(--soft);}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--white);}

footer{padding:40px 24px;text-align:center;font-size:12px;color:var(--soft);letter-spacing:.06em;}
footer a{color:var(--gold2);text-decoration:none;}
footer img{height:36px;width:auto;margin-bottom:14px;opacity:.85;}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

let lang='nl';
try{
  const saved=localStorage.getItem('szinn_ew_lang');
  if(saved==='en'||saved==='nl')lang=saved;
  else if((navigator.language||'').toLowerCase().indexOf('nl')!==0)lang='en';
}catch(e){}

let DATA=WHEELS[lang], BODY=BODIES[lang];
const svg=document.getElementById('wheel');
const NS="http://www.w3.org/2000/svg";
const CX=320, CY=320, R1=110, R2=204, R3=316;
let selCore=null, selWord=null, finalWord=null, selBody=[];

function txt(){return T[lang];}

function applyLang(){
  DATA=WHEELS[lang]; BODY=BODIES[lang];
  const t=txt();
  document.documentElement.lang=t.htmlLang;
  document.getElementById('langNL').classList.toggle('active',lang==='nl');
  document.getElementById('langEN').classList.toggle('active',lang==='en');
  const set=(id,v)=>{document.getElementById(id).textContent=v;};
  set('t_h1',t.h1); set('t_lede',t.lede);
  set('t_refineSub',t.refineSub); set('startFlow',t.startFlow);
  set('t_whenE',t.whenE); set('t_whenP',t.whenP);
  set('t_s1e',t.s1e); set('t_s1h',t.s1h); set('t_s1p',t.s1p); set('t_s1q',t.s1q);
  set('t_s1why',t.s1why); set('t_s1ex',t.s1ex);
  set('t_s2e',t.s2e); set('t_s2h',t.s2h); set('t_s2p',t.s2p); set('t_s2p2',t.s2p2);
  set('t_s2why',t.s2why); set('t_s2ex',t.s2ex); set('t_s2ex2',t.s2ex2);
  set('t_depthP',t.depthP); set('t_depthEx',t.depthEx);
  set('t_s3e',t.s3e); set('t_s3h',t.s3h); set('t_s3p',t.s3p);
  set('t_s3why',t.s3why); set('t_s3ex',t.s3ex);
  set('t_exLbl1',t.exLbl); set('t_exLbl2',t.exLbl); set('t_exLbl3',t.exLbl); set('t_exLbl4',t.exLbl); set('t_exLbl5',t.exLbl);
  set('t_breathT',t.breathT); set('breathBtn',t.breathBtn);
  document.getElementById('breathLabel').textContent='';
  resetBreath();
  set('finish',t.finish); set('restart1',t.restart);
  set('t_sumEyebrow',t.sumEyebrow); set('copyBtn',t.copyBtn); set('restart2',t.newCheckin);
  set('copied',t.copied);
  set('t_whyE',t.whyE); set('t_whyH',t.whyH); set('t_whyP',t.whyP); set('t_whyP2',t.whyP2);
  set('t_m1t',t.m1t); set('t_m1d',t.m1d);
  set('t_m2t',t.m2t); set('t_m2d',t.m2d);
  set('t_m3t',t.m3t); set('t_m3d',t.m3d);
  set('t_ctaE',t.ctaE); set('t_ctaH',t.ctaH); set('t_ctaP',t.ctaP);
  set('t_rights',t.rights);
  const cta=document.getElementById('ctaBtn'); cta.textContent=t.ctaBtn; cta.href=t.ctaHref;
  document.getElementById('trigger').placeholder=t.ph_trigger;
  document.getElementById('message').placeholder=t.ph_message;
  document.getElementById('depth').placeholder=t.ph_depth;
  document.getElementById('need').placeholder=t.ph_need;
  document.getElementById('hint').textContent=t.hint0;
  build();
  restartFlow(false);
}

function switchLang(l){
  if(l===lang)return;
  lang=l;
  try{localStorage.setItem('szinn_ew_lang',l);}catch(e){}
  applyLang();
}
document.getElementById('langNL').addEventListener('click',()=>switchLang('nl'));
document.getElementById('langEN').addEventListener('click',()=>switchLang('en'));

function pol(r,deg){const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)];}
function arcPath(r1,r2,a1,a2){
  const [x1,y1]=pol(r2,a1),[x2,y2]=pol(r2,a2),[x3,y3]=pol(r1,a2),[x4,y4]=pol(r1,a1);
  const large=(a2-a1)>180?1:0;
  return `M${x1},${y1} A${r2},${r2} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r1},${r1} 0 ${large} 0 ${x4},${y4} Z`;
}
function el(t,attrs){const e=document.createElementNS(NS,t);for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
function radialText(x,y,deg,size,txt,cls){
  let rot=deg-90; if(deg>180)rot+=180;
  const t=el('text',{x:x,y:y,'text-anchor':'middle','dominant-baseline':'middle','font-size':size,transform:`rotate(${rot},${x},${y})`});
  t.classList.add(cls);t.textContent=txt;return t;
}

function build(){
  svg.innerHTML='';
  const segCore=60, per=10, half=5;
  DATA.forEach((fam,i)=>{
    const a1=i*segCore, a2=a1+segCore;
    const cp=el('path',{d:arcPath(0,R1,a1,a2),fill:fam.color,stroke:'#F9F5F0','stroke-width':2});
    cp.dataset.core=i;
    cp.addEventListener('click',()=>pickCore(i));
    svg.appendChild(cp);
    const mid=(a1+a2)/2,[lx,ly]=pol(78,mid);
    let rot=mid; if(mid>90&&mid<270)rot+=180;
    const t=el('text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'middle','font-size':12.5,transform:`rotate(${rot},${lx},${ly})`});
    t.classList.add('core-label');t.textContent=fam.core;svg.appendChild(t);
    Object.keys(fam.words).forEach((w,j)=>{
      const w1=a1+j*per,w2=w1+per;
      const wp=el('path',{d:arcPath(R1,R2,w1,w2),fill:shade(fam.color,1+((j%2)?0.10:-0.04)),stroke:'#F9F5F0','stroke-width':2});
      wp.dataset.core=i; wp.dataset.word=w;
      wp.addEventListener('click',()=>pickWord(i,w));
      svg.appendChild(wp);
      const wm=(w1+w2)/2,[wx,wy]=pol((R1+R2)/2,wm);
      svg.appendChild(radialText(wx,wy,wm,11.5,w,'word-label'));
      fam.words[w].forEach((o,k)=>{
        const o1=w1+k*half,o2=o1+half;
        const op=el('path',{d:arcPath(R2,R3,o1,o2),fill:shade(fam.color,(k?1.30:1.20)),stroke:'#F9F5F0','stroke-width':1.5});
        op.dataset.core=i; op.dataset.word=w; op.dataset.outer=o;
        op.addEventListener('click',()=>pickOuter(i,w,o));
        svg.appendChild(op);
        const om=(o1+o2)/2,[ox,oy]=pol((R2+R3)/2,om);
        svg.appendChild(radialText(ox,oy,om,9.5,o,'outer-label'));
      });
    });
  });
  const c=el('circle',{cx:CX,cy:CY,r:22,fill:'#F9F5F0',stroke:'#B8965A','stroke-width':1});
  svg.appendChild(c);
}

function refreshDim(){
  svg.querySelectorAll('path').forEach(p=>{
    if(selCore===null){p.classList.remove('seg-dim','seg-active');return;}
    const isFam=p.dataset.core==selCore;
    p.classList.toggle('seg-dim',!isFam && p.dataset.core!==undefined);
    p.classList.toggle('seg-active',isFam);
  });
}

function pickCore(i){
  selCore=i; selWord=null; finalWord=null;
  refreshDim();
  document.getElementById('hint').textContent=txt().hint1;
  hide('refine');hide('flow');hide('summary');
}

function openRefine(i,w,chosen){
  const fam=DATA[i];
  document.getElementById('refineTitle').textContent=chosen;
  const box=document.getElementById('refineChips');box.innerHTML='';
  const opts=[w,...fam.words[w]];
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='chip'+(o===chosen?' sel':'');b.textContent=o;
    b.addEventListener('click',()=>{finalWord=o;document.getElementById('refineTitle').textContent=o;box.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');});
    box.appendChild(b);
  });
  show('refine');hide('flow');hide('summary');
  document.getElementById('refine').scrollIntoView({behavior:'smooth',block:'center'});
}

function pickWord(i,w){
  selCore=i; selWord=w; finalWord=w;
  refreshDim();
  openRefine(i,w,w);
}
function pickOuter(i,w,o){
  selCore=i; selWord=w; finalWord=o;
  refreshDim();
  openRefine(i,w,o);
}

function buildBodyChips(){
  const box=document.getElementById('bodyChips');box.innerHTML='';selBody=[];
  BODY.forEach(b=>{
    const c=document.createElement('button');c.className='chip';c.textContent=b;
    c.addEventListener('click',()=>{
      c.classList.toggle('sel');
      selBody=[...box.querySelectorAll('.chip.sel')].map(x=>x.textContent);
    });
    box.appendChild(c);
  });
}

function show(id){document.getElementById(id).classList.add('show');}
function hide(id){document.getElementById(id).classList.remove('show');}

document.getElementById('startFlow').addEventListener('click',()=>{
  buildBodyChips();
  resetBreath();
  document.getElementById('trigger').value='';
  document.getElementById('message').value='';
  document.getElementById('depth').value='';
  document.getElementById('need').value='';
  document.getElementById('intensity').value=5;
  document.getElementById('intensityVal').textContent='5';
  show('flow');
  document.getElementById('flow').scrollIntoView({behavior:'smooth',block:'start'});
});

let breathTimers=[];
function resetBreath(){
  breathTimers.forEach(clearTimeout);breathTimers=[];
  const c=document.getElementById('breathCircle');
  c.classList.remove('grow','slow');
  document.getElementById('breathLabel').textContent='';
  document.getElementById('breathBtn').style.display='inline-block';
}
document.getElementById('breathBtn').addEventListener('click',()=>{
  const t=txt();
  const c=document.getElementById('breathCircle');
  const l=document.getElementById('breathLabel');
  document.getElementById('breathBtn').style.display='none';
  breathTimers.forEach(clearTimeout);breathTimers=[];
  let delay=0;
  for(let i=0;i<3;i++){
    breathTimers.push(setTimeout(()=>{l.textContent=t.breathIn;c.classList.remove('slow');c.classList.add('grow');},delay));
    delay+=4000;
    breathTimers.push(setTimeout(()=>{l.textContent=t.breathOut;c.classList.add('slow');c.classList.remove('grow');},delay));
    delay+=6000;
  }
  breathTimers.push(setTimeout(()=>{l.textContent=t.breathDone;document.getElementById('breathBtn').style.display='inline-block';},delay));
});

document.getElementById('intensity').addEventListener('input',e=>{
  document.getElementById('intensityVal').textContent=e.target.value;
});

function restartFlow(scroll){
  selCore=null;selWord=null;finalWord=null;
  refreshDim();
  hide('refine');hide('flow');hide('summary');
  document.getElementById('hint').textContent=txt().hint0;
  if(scroll)document.getElementById('wheel').scrollIntoView({behavior:'smooth',block:'center'});
}
document.getElementById('restart1').addEventListener('click',()=>restartFlow(true));
document.getElementById('restart2').addEventListener('click',()=>restartFlow(true));

document.getElementById('finish').addEventListener('click',()=>{
  const t=txt();
  const fam=DATA[selCore];
  const intensity=document.getElementById('intensity').value;
  const trigger=document.getElementById('trigger').value.trim();
  const message=document.getElementById('message').value.trim();
  const depth=document.getElementById('depth').value.trim();
  const need=document.getElementById('need').value.trim();
  document.getElementById('sumWord').textContent=finalWord;
  document.getElementById('sumFamily').textContent=t.family+': '+fam.core+' · '+t.intensity+' '+intensity+'/10';
  const lines=[];
  if(selBody.length)lines.push('<b>'+t.l_body+':</b> '+selBody.join(', '));
  if(trigger)lines.push('<b>'+t.l_before+':</b> '+esc(trigger));
  if(message)lines.push('<b>'+t.l_shows+':</b> '+esc(message));
  if(depth)lines.push('<b>'+t.l_depth+':</b> '+esc(depth));
  if(need)lines.push('<b>'+t.l_need+':</b> '+esc(need));
  document.getElementById('sumLines').innerHTML=lines.join('<br>');
  const sup=document.getElementById('supportNote');
  if(selCore>=3){sup.textContent=t.support;sup.classList.add('show');}
  else{sup.classList.remove('show');}
  show('summary');
  document.getElementById('summary').scrollIntoView({behavior:'smooth',block:'center'});
  try{
    const log=JSON.parse(localStorage.getItem('szinn_emotiewiel')||'[]');
    log.push({d:new Date().toISOString(),lang:lang,word:finalWord,fam:fam.core,i:intensity,body:selBody,trigger,message,depth,need});
    localStorage.setItem('szinn_emotiewiel',JSON.stringify(log.slice(-60)));
  }catch(e){}
});

function esc(s){return s.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

document.getElementById('copyBtn').addEventListener('click',()=>{
  const t=txt();
  const fam=DATA[selCore];
  const d=new Date().toLocaleDateString(t.locale,{day:'numeric',month:'long',year:'numeric'});
  let out=`${t.checkinTitle} · ${d}\n${t.feeling}: ${finalWord} (${fam.core}), ${t.intensityWord} ${document.getElementById('intensity').value}/10\n`;
  if(selBody.length)out+=`${t.l_body}: ${selBody.join(', ')}\n`;
  const tr=document.getElementById('trigger').value.trim();
  const m=document.getElementById('message').value.trim();
  const dp=document.getElementById('depth').value.trim();
  const n=document.getElementById('need').value.trim();
  if(tr)out+=`${t.l_before}: ${tr}\n`;
  if(m)out+=`${t.l_shows}: ${m}\n`;
  if(dp)out+=`${t.l_depth}: ${dp}\n`;
  if(n)out+=`${t.l_need}: ${n}\n`;
  out+=`\nszinn.ai · Remember who you are.`;
  navigator.clipboard.writeText(out).then(()=>{
    const c=document.getElementById('copied');c.style.display='block';
    setTimeout(()=>c.style.display='none',2600);
  });
});

applyLang();
</script>
