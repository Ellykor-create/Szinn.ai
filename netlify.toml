[build]
  functions = "netlify/functions"
  publish   = "."
  command   = "npm install"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Background function: draait de blueprint-pipeline (max 15 min, vereist Netlify Pro).
# Chromium wordt niet gebundeld maar meegekopieerd; de templates leest de renderer
# van schijf en moeten dus expliciet mee in het function-pakket.
[functions."generate-blueprint-background"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]
  included_files = ["templates/*.html"]

# Background function: rendert de blueprint-HTML naar PDF (te traag voor de
# 10 seconden van een gewone function). Chromium wordt extern meegekopieerd.
[functions."blueprint-pdf-background"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]

# De api-functie rendert de demo-blueprint bij het inloggen én kan lokaal
# (netlify dev, zonder site-URL) zelf een PDF maken. Daarom moeten de templates
# mee én Chromium extern meegekopieerd worden.
[functions."api"]
  included_files       = ["templates/*.html", "szinn-portal/journey/client.json", "szinn-portal/journey/client-nl.json"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]

# Ingeplande functie: verstuurt cadeau-e-mails op hun verzenddatum, om 00:01 UTC
# (net na middernacht) zodat het cadeau op de gekozen datum aankomt.
[functions."process-gifts"]
  schedule = "1 0 * * *"

# Ingeplande functie: dagelijkse WhatsApp-reading rond 12:00 NL-tijd. Draait op
# 10:00 én 11:00 UTC; de functie stuurt alleen in het 12:xx-venster van Amsterdam
# (DST-proof, precies één keer per dag).
[functions."daily-whatsapp"]
  schedule = "0 10,11 * * *"

# ── Schone portal- en cadeau-URL's (geen .html) ──────────────────────────────
[[redirects]]
  from = "/portaal"
  to = "/szinn-portal/pages/dashboard.html"
  status = 200
[[redirects]]
  from = "/portaal/inloggen"
  to = "/szinn-portal/pages/login.html"
  status = 200
[[redirects]]
  from = "/portaal/vragenlijst"
  to = "/szinn-portal/pages/questionnaire.html"
  status = 200
[[redirects]]
  from = "/portaal/blueprint"
  to = "/szinn-portal/pages/blueprint-viewer.html"
  status = 200
[[redirects]]
  from = "/portaal/mandala"
  to = "/szinn-portal/pages/mandala.html"
  status = 200
[[redirects]]
  from = "/portaal/journey"
  to = "/portaal/journey/"
  status = 301
# De klantdata en het kaartbeeld van de journey zijn per gebruiker en komen
# uit de api-functie; deze regels moeten vóór de statische splat hieronder.
[[redirects]]
  from = "/portaal/journey/client.json"
  to = "/.netlify/functions/api"
  status = 200
[[redirects]]
  from = "/portaal/journey/client-nl.json"
  to = "/.netlify/functions/api"
  status = 200
[[redirects]]
  from = "/portaal/journey/client-en.json"
  to = "/.netlify/functions/api"
  status = 200
[[redirects]]
  from = "/portaal/journey/chart.svg"
  to = "/.netlify/functions/api"
  status = 200
# De journey is een map met eigen relatieve assets; de splat houdt alles onder
# /portaal/journey/ werkend (css, js, assets, downloads).
[[redirects]]
  from = "/portaal/journey/*"
  to = "/szinn-portal/journey/:splat"
  status = 200
[[redirects]]
  from = "/cadeau"
  to = "/szinn-portal/pages/gift.html"
  status = 200
[[redirects]]
  from = "/cadeau/verzilveren"
  to = "/intake/index.html"
  status = 302

# Oude .html-pagina's 301 naar hun schone variant
[[redirects]]
  from = "/szinn-portal/pages/dashboard.html"
  to = "/portaal"
  status = 301
[[redirects]]
  from = "/szinn-portal/pages/login.html"
